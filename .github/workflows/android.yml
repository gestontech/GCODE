name: GCODE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Vérifier Node.js et npm
        run: |
          node --version
          npm --version

      - name: Installer les dépendances
        run: npm install

      - name: Vérifier Expo
        run: npx expo-doctor

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --non-interactive

      - name: Configurer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rendre Gradle exécutable
        run: chmod +x android/gradlew

      - name: Construire APK Debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: GCODE-Mobile-V3-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
