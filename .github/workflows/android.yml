name: GCODE Android APK V3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build GCODE Mobile V3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Vérifier Node.js et npm
        run: |
          node --version
          npm --version

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les dépendances Expo
        run: npx expo-doctor

      - name: Générer le projet Android
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Rendre Gradle exécutable
        run: chmod +x android/gradlew

      - name: Vérifier la configuration Android
        working-directory: android
        run: ./gradlew --version

      - name: Construire APK Release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Vérifier que l'APK existe
        run: |
          ls -lah android/app/build/outputs/apk/release/
          test -f android/app/build/outputs/apk/release/app-release.apk

      - name: Renommer l'APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             GCODE-Mobile-V3.apk

      - name: Publier l'APK V3
        uses: actions/upload-artifact@v4
        with:
          name: GCODE-Mobile-V3-APK
          path: GCODE-Mobile-V3.apk
          if-no-files-found: error
          retention-days: 30
